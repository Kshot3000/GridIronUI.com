<style>
/* news wire headline search (v1.152.0) — page-scoped so no shared CSS changes */
.news-search{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px;max-width:640px}
.news-search input{flex:1;min-width:200px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:11px 13px;font-size:.95rem;font-family:var(--font-body)}
.news-search input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.18)}
.news-search button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;
  padding:11px 16px;font-weight:700;font-size:.9rem;cursor:pointer;white-space:nowrap}
.news-search button:hover{color:var(--gold);border-color:var(--gold)}
.news-count{font-size:.85rem;color:var(--muted);min-height:1.3em}
#newsGrid mark{background:rgba(240,180,41,.30);color:inherit;border-radius:3px;padding:0 1px}
/* v1.157.0 — followed teams on the news wire: "Your teams" jump strip,
   gold card rail + ★ tag, and a :target ring on the jumped-to card */
.follow-strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 16px}
.follow-strip[hidden]{display:none}
.follow-strip-label{font-weight:700;color:var(--gold-soft);font-size:.86rem}
.follow-chip-link{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(240,180,41,.45);border-radius:999px;padding:4px 11px;color:var(--text);background:rgba(240,180,41,.07);font-size:.84rem;text-decoration:none;max-width:100%}
.follow-chip-link:hover{color:var(--gold-soft);border-color:var(--gold)}
.follow-chip-link b{color:var(--gold)}
#newsGrid .card.followed{border-color:rgba(240,180,41,.55);box-shadow:inset 3px 0 0 var(--gold)}
#newsGrid .card:target{border-color:var(--gold);box-shadow:0 0 0 2px rgba(240,180,41,.45)}
#newsGrid .card{scroll-margin-top:90px}
.tag.your-team{background:rgba(240,180,41,.14);color:var(--gold-soft);border:1px solid rgba(240,180,41,.4)}
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3316742664595468" crossorigin="anonymous"></script>
</head>
<body data-feedcheck>
<script>window.GIU_BASE=".";</script>
<div id="site-header"></div>

<section class="page-hero">
  <div class="hero-bg" aria-hidden="true" style="background-image:url('img/heroes/hero-boot.jpg')"></div>
  <div class="wrap hero-inner">
    <a class="back-link" href="index.html" style="position:relative;z-index:2">← Home</a>
    <span class="kicker">Live data</span>
    <h1>News wire</h1>
    <p class="lede">The latest headlines across every major league — grouped, timestamped, and linked to the full story.</p>
  </div>
</section>

<div class="wrap" style="margin-top:30px">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
    <span id="liveStatus" class="live-status" role="status" aria-live="polite"></span>
    <button class="btn btn-ghost btn-sm" id="pauseBtn" aria-pressed="false" style="display:none">⏸ Pause live</button>
  </div>
  <div class="news-search" role="search">
    <label class="sr-only" for="newsSearch">Search headlines</label>
    <input id="newsSearch" type="search" autocomplete="off" spellcheck="false" aria-describedby="newsCount"
           placeholder="Search headlines — a player, a team, “trade”, “injury”…">
    <button id="newsClear" type="button" hidden>Clear</button>
    <span class="news-count" id="newsCount" role="status" aria-live="polite"></span>
  </div>
  <div class="tabs" id="newsTabs"></div>
  <!-- v1.157.0 — "Your teams" jump strip: one chip per followed-team story in the current view (js/news.js renders it; hidden when nothing matches) -->
  <div id="newsFollow" class="follow-strip" hidden></div>
  <div class="grid grid-2" id="newsGrid"></div>

  <!-- v1.29.0 — display ad slot (renders only once an AdSense ad-unit ID is set) -->
  <div class="ad-slot" data-ad-slot="newsInline"></div>
</div>

<div id="site-footer"></div>
<script src="js/site.js?v=1.104.0"></script>
<script src="js/team-follow.js?v=1.142.0"></script>
<script src="js/news.js?v=1.157.0"></script>
</body>
